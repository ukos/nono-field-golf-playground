<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>HD-2D フィールドゴルフ 試作（テストホール）</title>
<!-- アプリアイコン（2026-11-22 ユーザー指定）：ユーザーのゲームロゴから生成。ホーム画面追加でこのアイコンになる -->
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="FIELD GOLF">
<meta name="theme-color" content="#1d5c38">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { width:100%; height:100%; overflow:hidden; background:#79b5d9; font-family:"Hiragino Sans","Noto Sans JP",sans-serif; touch-action:none; user-select:none; -webkit-user-select:none; -webkit-text-size-adjust:100%; text-size-adjust:100%; }
  #game { position:fixed; top:0; left:0; right:0; height:100vh; height:100dvh; height:var(--apph, 100dvh); }
  canvas { display:block; }
  /* UI は「実際に見えている領域（visualViewport）」の高さに合わせたコンテナの中に置く。
     ブラウザのツールバー表示状態でレイアウト側の高さだけ大きいと、下部の操作系が
     画面外に落ちて見えなくなるケースへの対策（2026-11-22 ユーザー報告）。 */
  #ui { position:fixed; top:0; left:0; width:var(--appw, 100%); height:100vh; height:100dvh; height:var(--apph, 100dvh); z-index:5; pointer-events:none; }
  #ui > * { pointer-events:none; }
  #clubList, #setBtn, #stick, #shotBtn, #result, #settings { pointer-events:auto; }

  /* ロゴ画面（起動時スプラッシュ、2026-11-22 ユーザー指示） */
  #splash { position:fixed; top:0; left:0; width:var(--appw, 100%); height:100vh; height:100dvh; height:var(--apph, 100dvh); z-index:50; background:#fff; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4vh; cursor:pointer; transition:opacity .45s ease; }
  #splash.hide { opacity:0; pointer-events:none; }
  #splash img { width:min(calc(var(--appw, 100vw) * 0.76), 400px); max-width:100%; height:auto; animation:splashIn .7s ease both; }
  @keyframes splashIn { from { opacity:0; transform:scale(.93); } to { opacity:1; transform:scale(1); } }
  #splashTap { color:#1d5c38; font-size:17px; font-weight:800; letter-spacing:.22em; animation:tapBlink 1.6s ease-in-out infinite; }
  @keyframes tapBlink { 0%,100% { opacity:1; } 50% { opacity:.25; } }
  #splashVer { color:#8aa393; font-size:11px; letter-spacing:.12em; }

  /* 上部情報 */
  #topbar { position:absolute; top:8px; left:10px; z-index:10; color:#fff; text-shadow:0 1px 3px rgba(0,0,0,.55); pointer-events:none; }
  #topbar .hole { font-size:17px; font-weight:700; letter-spacing:.02em; }
  #topbar .sub { font-size:13px; margin-top:2px; }
  #topbar .sub b { font-size:15px; }

  /* スイングゲージ */
  #gaugeWrap { position:absolute; top:10px; left:50%; transform:translateX(-50%); width:min(520px,50vw); z-index:10; pointer-events:none; }
  #gaugeLabel { text-align:center; color:#fff; font-size:12px; font-weight:700; text-shadow:0 1px 3px rgba(0,0,0,.6); margin-bottom:3px; letter-spacing:.15em; }
  #gauge { position:relative; height:22px; background:linear-gradient(90deg,#e74c3c,#f1c40f 38%,#f1c40f 62%,#e74c3c); border:2px solid rgba(255,255,255,.85); border-radius:11px; box-shadow:0 2px 8px rgba(0,0,0,.35); overflow:hidden; }
  #bestZone { position:absolute; top:0; bottom:0; left:46%; width:8%; background:rgba(46,204,113,.85); border-left:2px solid #fff; border-right:2px solid #fff; }
  #needle { position:absolute; top:-2px; bottom:-2px; width:5px; margin-left:-2.5px; background:#fff; box-shadow:0 0 6px #000; border-radius:2px; left:50%; display:none; }
  #gaugeMsg { text-align:center; color:#fff; font-size:14px; font-weight:700; text-shadow:0 1px 4px rgba(0,0,0,.65); margin-top:5px; min-height:19px; }

  /* クラブリスト（右上）：通常は最小化し、選択中のクラブだけ見せる。タップで展開（2026-11-22 ユーザー指示） */
  #clubList { position:absolute; top:8px; right:8px; z-index:10; width:104px; background:rgba(12,26,18,.62); border:1px solid rgba(255,255,255,.35); border-radius:10px; padding:4px; backdrop-filter:blur(2px); }
  #clubHead { cursor:pointer; }
  #clubList .ttl { color:#ffe9a8; font-size:11px; font-weight:700; text-align:center; padding:2px 0 1px; letter-spacing:.1em; }
  #clubCur { color:#fff; font-size:15px; font-weight:800; text-align:center; padding:1px 0 3px; }
  #clubCur .d { color:#b9d6b9; font-size:11px; font-weight:400; margin-left:4px; }
  #clubCur .arw { color:#ffe9a8; font-size:10px; margin-left:5px; }
  #clubItems { display:none; max-height:56vh; overflow-y:auto; }
  #clubList.open #clubItems { display:block; }
  .club { display:flex; justify-content:space-between; align-items:center; padding:4px 7px; margin:2px 0; border-radius:6px; color:#e8f2e8; font-size:13px; cursor:pointer; background:rgba(255,255,255,.06); }
  .club .d { color:#b9d6b9; font-size:11px; }
  .club.sel { background:#2e9e57; color:#fff; font-weight:700; }
  .club.sel .d { color:#eaffea; }

  /* 設定ボタンと設定画面 */
  #setBtn { position:absolute; top:74px; left:10px; z-index:10; padding:6px 13px; font-size:12px; font-weight:700; color:#fff; background:rgba(12,26,18,.55); border:1px solid rgba(255,255,255,.4); border-radius:16px; cursor:pointer; }
  #settings { position:absolute; inset:0; z-index:30; display:none; align-items:flex-start; justify-content:center; background:rgba(8,20,12,.5); overflow-y:auto; padding:26px 12px; }
  #settings .card { background:rgba(255,255,255,.97); border-radius:16px; padding:20px 22px; width:min(430px,94vw); box-shadow:0 8px 30px rgba(0,0,0,.4); }
  #settings h2 { font-size:18px; color:#14532d; margin-bottom:6px; }
  #settings h3 { font-size:13px; color:#33475b; margin:16px 0 7px; border-bottom:1px solid #dde5dd; padding-bottom:4px; }
  #settings .note { font-size:11px; color:#7a8a7a; margin-top:4px; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; }
  .chip { padding:6px 10px; font-size:13px; border-radius:15px; border:1.5px solid #b9c9b9; background:#f2f6f2; color:#44554a; cursor:pointer; }
  .chip.on { background:#2e9e57; border-color:#2e9e57; color:#fff; font-weight:700; }
  .chip.lock { opacity:.55; cursor:default; }
  #settings .row { display:flex; gap:14px; align-items:center; font-size:14px; color:#33475b; }
  #settings .row label { cursor:pointer; }
  #settings .btns { display:flex; gap:10px; margin-top:20px; }
  #settings .btns button { flex:1; padding:11px 0; font-size:15px; font-weight:700; border:none; border-radius:9px; cursor:pointer; }
  #setClose { background:#2e9e57; color:#fff; }
  #setReset { background:#eef1ee; color:#a33; }

  /* スティック（左下） */
  #stick { position:absolute; left:22px; bottom:calc(26px + env(safe-area-inset-bottom, 0px)); width:59px; height:59px; border-radius:50%; background:rgba(10,20,14,.38); border:2px solid rgba(255,255,255,.5); z-index:10; }
  #stick::before { content:"方向"; position:absolute; top:-19px; left:0; right:0; text-align:center; color:#fff; font-size:11px; font-weight:700; text-shadow:0 1px 3px rgba(0,0,0,.6); }
  #knob { position:absolute; left:50%; top:50%; width:26px; height:26px; margin:-13px 0 0 -13px; border-radius:50%; background:rgba(255,255,255,.82); box-shadow:0 2px 6px rgba(0,0,0,.4); }

  /* ショットボタン（右下） */
  #shotBtn { position:absolute; right:24px; bottom:calc(30px + env(safe-area-inset-bottom, 0px)); width:52px; height:52px; border-radius:50%; z-index:10;
    background:radial-gradient(circle at 35% 30%, #ff9d5c, #e8541d 70%); border:2px solid rgba(255,255,255,.85);
    color:#fff; font-size:11px; font-weight:800; letter-spacing:.05em; box-shadow:0 4px 14px rgba(0,0,0,.45); cursor:pointer; }
  #shotBtn:active, #shotBtn.hold { background:radial-gradient(circle at 35% 30%, #ffd35c, #e8a51d 70%); transform:scale(.96); }
  #shotBtn:disabled { opacity:.45; }

  /* 結果オーバーレイ */
  #result { position:absolute; inset:0; z-index:20; display:none; align-items:center; justify-content:center; background:rgba(8,20,12,.45); }
  #result .card { background:rgba(255,255,255,.95); border-radius:16px; padding:26px 34px; text-align:center; box-shadow:0 8px 30px rgba(0,0,0,.4); }
  #result .big { font-size:26px; font-weight:800; color:#14532d; }
  #result .detail { font-size:15px; color:#33475b; margin-top:8px; }
  #result button { margin-top:16px; padding:10px 26px; font-size:16px; font-weight:700; border:none; border-radius:9px; background:#2e9e57; color:#fff; cursor:pointer; }

  #hint { position:absolute; bottom:calc(6px + env(safe-area-inset-bottom, 0px)); left:50%; transform:translateX(-50%); color:rgba(255,255,255,.85); font-size:11px; text-shadow:0 1px 2px rgba(0,0,0,.6); z-index:9; pointer-events:none; white-space:nowrap; }

  /* 横向き（ランドスケープ）対応：低い画面でも UI が収まるように圧縮 */
  @media (orientation: landscape) and (max-height: 540px) {
    #clubList { width:92px; }
    #clubItems { max-height:88vh; }
    #clubList .ttl { font-size:10px; padding:1px 0 2px; }
    #setBtn { top:60px; }
    .club { padding:2px 6px; margin:1px 0; font-size:12px; }
    .club .d { font-size:10px; }
    #shotBtn { width:40px; height:40px; font-size:10px; right:16px; bottom:16px; }
    #stick { width:46px; height:46px; left:16px; bottom:16px; }
    #knob { width:21px; height:21px; margin:-10.5px 0 0 -10.5px; }
    #gaugeWrap { width:40vw; }
    #topbar .hole { font-size:13px; }
    #topbar .sub { font-size:11px; }
    #topbar .sub b { font-size:12px; }
    #hint { display:none; }
  }
</style>
</head>
<body>
<div id="game"></div>

<div id="ui">
<div id="topbar">
  <div class="hole">HOLE 1 ・ はじまりの野</div>
  <div class="sub">Par 4 ／ <span id="strokes">0</span> 打目 ・ 残り <b id="remain">350</b> m</div>
</div>

<div id="gaugeWrap">
  <div id="gaugeLabel">SWING</div>
  <div id="gauge"><div id="bestZone"></div><div id="needle"></div></div>
  <div id="gaugeMsg"></div>
</div>

<div id="clubList">
  <div id="clubHead"><div class="ttl">CLUB</div><div id="clubCur"></div></div>
  <div id="clubItems"></div>
</div>
<button id="setBtn">⚙ 設定</button>

<div id="settings"><div class="card">
  <h2>設定</h2>
  <h3>クラブセット（バッグに入れるクラブ）</h3>
  <div class="chips" id="bagChips"></div>
  <div class="note">クエストで入手したクラブもここで入れ替えられます（試作では全14本を所持）。PT は常に入っています。</div>
  <h3>ショット後のカメラ演出</h3>
  <div class="chips" id="camChips"></div>
  <div class="note">「ランダム」はショットごとに抽選します。短いショットでは一部パターンをクォーターに読み替えます。</div>
  <h3>スイング視点</h3>
  <div class="chips" id="viewChips"></div>
  <h3>サウンド</h3>
  <div class="row"><label><input type="radio" name="snd" id="sndOn"> ON</label><label><input type="radio" name="snd" id="sndOff"> OFF</label></div>
  <div class="btns"><button id="setReset">ホールを最初から</button><button id="setClose">閉じる</button></div>
</div></div>

<div id="stick"><div id="knob"></div></div>
<button id="shotBtn">SHOT</button>

<div id="result"><div class="card">
  <div class="big" id="resultTitle">カップイン！</div>
  <div class="detail" id="resultDetail"></div>
  <button id="againBtn">もう一度回る</button>
</div></div>

<div id="hint">スティック：方向 ／ SHOT：押してる間ゲージが往復、離すと打つ</div>
</div><!-- /#ui -->

<div id="splash">
  <img src="logo.jpg" alt="FIELD GOLF HD-2D">
  <div id="splashTap">TAP TO START</div>
  <div id="splashVer">PROTOTYPE</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
"use strict";
/* ============ 版チェック（ブラウザキャッシュで古いページが残る問題への対策） ============
   サーバー上の version.txt とこのページの版が違えば、新しいURLで開き直して最新版を取りに行く。
   公開のたびに PAGE_VER と version.txt を一緒に上げること。 */
const PAGE_VER = "0.11.2";
(function(){
  try {
    fetch("version.txt", { cache: "no-store" }).then(r => r.text()).then(v => {
      v = (v || "").trim();
      if (v && v !== PAGE_VER && !/[?&]upd=/.test(location.search)){
        location.replace(location.pathname + "?upd=" + encodeURIComponent(v));
      }
    }).catch(() => {});
  } catch(e) { /* 取れなければ通常表示 */ }
})();
/* ============ データ（試作計画のクラブパラメータ表） ============ */
const CLUBS = [
  { name:"1W", dist:230, angle:12, carry:0.85, gauge:0.90, best:8  },
  { name:"3W", dist:210, angle:14, carry:0.86, gauge:0.95, best:9  },
  { name:"5W", dist:195, angle:16, carry:0.86, gauge:1.00, best:10 },
  { name:"UT", dist:180, angle:18, carry:0.87, gauge:1.00, best:10 },
  { name:"4I", dist:170, angle:20, carry:0.88, gauge:1.05, best:11 },
  { name:"5I", dist:160, angle:22, carry:0.89, gauge:1.08, best:11 },
  { name:"6I", dist:150, angle:24, carry:0.90, gauge:1.10, best:12 },
  { name:"7I", dist:140, angle:26, carry:0.90, gauge:1.12, best:12 },
  { name:"8I", dist:130, angle:29, carry:0.92, gauge:1.15, best:13 },
  { name:"9I", dist:120, angle:32, carry:0.93, gauge:1.15, best:14 },
  { name:"PW", dist:105, angle:36, carry:0.95, gauge:1.20, best:16 },
  { name:"AW", dist: 90, angle:40, carry:0.96, gauge:1.20, best:17 },
  { name:"SW", dist: 70, angle:45, carry:0.97, gauge:1.25, best:18 },
  { name:"PT", dist:  0, angle: 0, carry:0.00, gauge:1.30, best:20 }
];
const HOLE_LEN = 350, PAR = 4;
const CUP = new THREE.Vector3(0, 0, -HOLE_LEN);
const GREEN_R = 14;
const LAKE = { x0:30, x1:98, z0:-272, z1:-118 };   // 右側の湖
const GRAV = 13, ROLL_A = 65, PUTT_A = 12;

/* ============ 状態 ============ */
let state = "aim";           // aim | hold | swing | fly | roll | done
let clubIdx = 0;
let strokes = 0;
let aimOffset = 0;           // ラジアン（スティック）
let lockedAim = 0;
let holdStart = 0, needlePos = 0.5;
let shot = null;             // 飛行中データ
let holdStage = 0;           // hold 中のポーズ段階（0=アドレス 1=テークバック 2=トップ）
let seqScale = 1;            // スイングシーケンスの時間倍率（パターは 0.6、pressStart で確定）
let swingT = 0, swingP = 0.5;   // swing 状態の経過秒と、離した瞬間に確定したゲージ位置
let swingStage = 0;          // 発射後のポーズ段階（1=インパクト 2=フォロースルー 3=フィニッシュ）
let prevBallPos = new THREE.Vector3(0, 0, 0);
let msgTimer = null;

/* ============ Three.js 準備 ============ */
const container = document.getElementById("game");
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
container.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9fd3ee);
scene.fog = new THREE.Fog(0x9fd3ee, 180, 700);
const camera = new THREE.PerspectiveCamera(55, window.innerWidth/window.innerHeight, 0.1, 1500);
scene.add(new THREE.HemisphereLight(0xcfeaff, 0x4a7c43, 0.95));
const sun = new THREE.DirectionalLight(0xfff2d8, 0.75);
sun.position.set(60, 120, 40); scene.add(sun);

function rng(seed){ let a = seed; return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rand = rng(20261121);

/* ============ スケルトン表示（遮蔽物の半透明化） ============
   カメラとキャラ（ボール）の間に建物・木・岩が入ったら、その物体を半透明にして
   向こう側が見えるようにする（2026-11-22 ユーザー指示）。 */
const occluders = [];   // { meshes:[...], mats:[{mat, base}], fade:1, goal:1 }
function regOccluder(root){
  const meshes = [], mats = [], seen = new Set();
  root.traverse(o => {
    if (o.isMesh){
      meshes.push(o);
      if (!seen.has(o.material)){ seen.add(o.material); o.material.transparent = true; mats.push({ mat:o.material, base:o.material.opacity }); }
    }
  });
  if (meshes.length) occluders.push({ meshes, mats, fade:1, goal:1 });
}
const _occRay = new THREE.Raycaster();
const _occFrom = new THREE.Vector3(), _occTo = new THREE.Vector3(), _occDir = new THREE.Vector3();
let occFrame = 0;
function updateOccluders(){
  // 判定は3フレームに1回、透明度の遷移は毎フレーム滑らかに。
  // 視線はキャラ中心と頭部の2点で判定する（中心だけだと葉や屋根に頭が隠れるケースを拾えない）
  if ((occFrame++ % 3) === 0){
    _occFrom.copy(camera.position);
    const all = [];
    for (const u of occluders) for (const m of u.meshes) all.push(m);
    const hits = new Set();
    const targets = chara.visible
      ? [chara.position, _occTo.set(chara.position.x, chara.position.y + 0.8, chara.position.z)]
      : [ball.position];
    for (const tp of targets){
      _occDir.subVectors(tp, _occFrom);
      const dist = _occDir.length();
      _occRay.set(_occFrom, _occDir.normalize());
      _occRay.far = dist - 0.8;
      for (const h of _occRay.intersectObjects(all, false)) hits.add(h.object);
    }
    for (const u of occluders) u.goal = u.meshes.some(m => hits.has(m)) ? 0.16 : 1;
  }
  for (const u of occluders){
    if (Math.abs(u.goal - u.fade) > 0.005){
      u.fade += (u.goal - u.fade) * 0.3;
      for (const e of u.mats) e.mat.opacity = e.base * u.fade;
    }
  }
}

/* ============ コース ============ */
function plane(w, l, color, x, z, y){
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, l), new THREE.MeshLambertMaterial({ color }));
  m.rotation.x = -Math.PI/2; m.position.set(x, y||0, z); scene.add(m); return m;
}
plane(500, 900, 0x3f8f4e, 0, -160, -0.05);                 // ラフ全体
plane(50, 400, 0x63c168, 0, -165, 0);                      // フェアウェイ
(function(){ // グリーン
  const g = new THREE.Mesh(new THREE.CircleGeometry(GREEN_R, 40), new THREE.MeshLambertMaterial({ color:0x83d97e }));
  g.rotation.x = -Math.PI/2; g.position.set(CUP.x, 0.02, CUP.z); scene.add(g);
})();
// 湖（右側）
(function(){
  const w = new THREE.Mesh(new THREE.PlaneGeometry(LAKE.x1-LAKE.x0, LAKE.z1-LAKE.z0),
    new THREE.MeshPhongMaterial({ color:0x2f8fd0, transparent:true, opacity:0.82, shininess:120 }));
  w.rotation.x = -Math.PI/2;
  w.position.set((LAKE.x0+LAKE.x1)/2, 0.04, (LAKE.z0+LAKE.z1)/2); scene.add(w);
  const sand = new THREE.Mesh(new THREE.PlaneGeometry(LAKE.x1-LAKE.x0+8, LAKE.z1-LAKE.z0+8),
    new THREE.MeshLambertMaterial({ color:0xe4d193 }));
  sand.rotation.x = -Math.PI/2;
  sand.position.set((LAKE.x0+LAKE.x1)/2, 0.01, (LAKE.z0+LAKE.z1)/2); scene.add(sand);
})();
// 遠景の山と雲
for (let i=0;i<6;i++){
  const mtn = new THREE.Mesh(new THREE.ConeGeometry(60+rand()*50, 55+rand()*45, 5),
    new THREE.MeshLambertMaterial({ color:0x7d9cbd }));
  mtn.position.set(-260+i*105, 20, -480-rand()*60); scene.add(mtn);
}
for (let i=0;i<7;i++){
  const cl = new THREE.Mesh(new THREE.SphereGeometry(9+rand()*8, 10, 8),
    new THREE.MeshBasicMaterial({ color:0xffffff, transparent:true, opacity:0.92 }));
  cl.scale.y = 0.38; cl.position.set(-220+rand()*440, 78+rand()*30, -120-rand()*300); scene.add(cl);

/* ============ 計算ヘルパ ============ */
function distToCup(){ return Math.hypot(ball.position.x - CUP.x, ball.position.z - CUP.z); }
function baseAngle(){ return Math.atan2(CUP.x - ball.position.x, -(CUP.z - ball.position.z)) * -1; }
function aimVector(off){
  // カップ方向を 0 とし、off（符号付きラジアン、＋＝右）だけ傾けた単位ベクトル
  const dx = CUP.x - ball.position.x, dz = CUP.z - ball.position.z;
  const L = Math.hypot(dx, dz) || 1;
  const bx = dx / L, bz = dz / L;
  const a = -off, c = Math.cos(a), s = Math.sin(a);
  return new THREE.Vector3(bx * c + bz * s, 0, bz * c - bx * s).normalize();
}
function quarterK(t){ const k = Math.min(Math.max(t / 0.6, 0), 1); return k * k * (3 - 2 * k); }   // 飛行カメラの移行度（0〜0.6秒で smoothstep）
function effDist(){
  const c = CLUBS[clubIdx];
  if (c.name === "PT") return Math.min(distToCup(), 60);
  return c.dist;
}
function inLake(x, z){ return x > LAKE.x0 && x < LAKE.x1 && z < LAKE.z1 && z > LAKE.z0; }
function onGreen(){ return distToCup() <= GREEN_R; }
/* 地面の種類と、跳ね（bounce）・転がり（roll）の係数（2026-11-22 ユーザー指示：
   ボールは地面の種類によって跳ねたり転がったりする） */
const SURF = {
  green:   { bounce:0.9,  roll:1.15 },   // よく転がる
  fairway: { bounce:1.0,  roll:1.0 },    // 標準
  rough:   { bounce:0.5,  roll:0.45 },   // 跳ねが死に、草で止まる
  sand:    { bounce:0.15, roll:0.10 }    // ほぼ跳ねず、めり込んで止まる
};
function surfaceAt(x, z){
  if (inLake(x, z)) return "water";
  if (Math.hypot(x - CUP.x, z - CUP.z) <= GREEN_R) return "green";
  if (x > LAKE.x0 - 4 && x < LAKE.x1 + 4 && z < LAKE.z1 + 4 && z > LAKE.z0 - 4) return "sand";
  if (Math.abs(x) <= 25 && z <= 35 && z >= -365) return "fairway";
  return "rough";
}

  const max = stickMax();

      const o = ac.createOscillator(), g = ac.createGain();
      o.type = "sine"; o.frequency.value = 220;
      g.gain.setValueAtTime(0.25, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
      o.connect(g).connect(ac.destination); o.start(t); o.stop(t + 0.13); return;
    }
    const len = Math.floor(ac.sampleRate * 0.3);
    const buf = ac.createBuffer(1, len, ac.sampleRate);
    const ch = buf.getChannelData(0);
    for (let i=0;i<len;i++) ch[i] = (Math.random()*2-1) * (1 - i/len);
    const src = ac.createBufferSource(); src.buffer = buf;
    const bp = ac.createBiquadFilter(); bp.type = "bandpass"; bp.Q.value = 1.1;
    bp.frequency.setValueAtTime(750, t);
    bp.frequency.exponentialRampToValueAtTime(2900, t + 0.1);
    bp.frequency.exponentialRampToValueAtTime(420, t + 0.28);
    const g = ac.createGain();
    g.gain.setValueAtTime(best ? 0.85 : 0.5, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
    src.connect(bp).connect(g).connect(ac.destination); src.start(t);
    if (best){ // 低い胴鳴り
      const o = ac.createOscillator(), og = ac.createGain();
      o.type = "sine"; o.frequency.setValueAtTime(160, t);
      o.frequency.exponentialRampToValueAtTime(60, t + 0.18);
      og.gain.setValueAtTime(0.4, t); og.gain.exponentialRampToValueAtTime(0.001, t + 0.2);
      o.connect(og).connect(ac.destination); o.start(t); o.stop(t + 0.22);
    }
  } catch(e) { /* 試作：音が出なくても続行 */ }
}
function splashSound(){
  if (!settings.sound) return;
  try {
    const ac = audio(), t = ac.currentTime;
    const len = Math.floor(ac.sampleRate * 0.4);
    const buf = ac.createBuffer(1, len, ac.sampleRate);
    const ch = buf.getChannelData(0);
    for (let i=0;i<len;i++) ch[i] = (Math.random()*2-1) * Math.sin(Math.PI * i/len);
    const src = ac.createBufferSource(); src.buffer = buf;
    const lp = ac.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 900;
    const g = ac.createGain(); g.gain.value = 0.5;
    src.connect(lp).connect(g).connect(ac.destination); src.start(t);
  } catch(e) {}
}
function cupSound(){
  if (!settings.sound) return;
  try {
    const ac = audio(), t = ac.currentTime;
    [660, 990].forEach((f, i) => {
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = "sine"; o.frequency.value = f;
      g.gain.setValueAtTime(0.001, t + i*0.12);
      g.gain.exponentialRampToValueAtTime(0.3, t + i*0.12 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.001, t + i*0.12 + 0.35);
      o.connect(g).connect(ac.destination); o.start(t + i*0.12); o.stop(t + i*0.12 + 0.4);
    });
  } catch(e) {}
}

/* ============ BGM・環境音・地面別サウンド（2026-11-22 ユーザー指示） ============ */
// 方針：BGM はのんべんだらりではなく爽快に。明るい長調・テンポ138・プラック音色の
// パラパラした主旋律をループさせる。その上に風の音（サラサラ）、スイングの風切り
// （シュパーン）、飛行中の風切り、地面の種類ごとの着地・転がり音を重ねる。
// すべて生成音（WebAudio）で音声ファイルは使わない。新規の音は soundBus 経由で、
// 設定のサウンド ON/OFF がバスごと効く（従来の効果音は個別に settings.sound を見る）。
let busNode = null;
function soundBus(ac){
  if (!busNode){ busNode = ac.createGain(); busNode.gain.value = settings.sound ? 1 : 0; busNode.connect(ac.destination); }
  return busNode;
}
function soundApply(){ if (busNode && AC) busNode.gain.setTargetAtTime(settings.sound ? 1 : 0, AC.currentTime, 0.03); }
let noiseBuf = null;
function getNoise(ac){
  if (noiseBuf && noiseBuf.sampleRate === ac.sampleRate) return noiseBuf;
  const len = ac.sampleRate * 2;
  noiseBuf = ac.createBuffer(1, len, ac.sampleRate);
  const ch = noiseBuf.getChannelData(0);
  for (let i = 0; i < len; i++) ch[i] = Math.random() * 2 - 1;
  return noiseBuf;
}
function noiseSrc(ac, loop){ const s = ac.createBufferSource(); s.buffer = getNoise(ac); s.loop = !!loop; return s; }
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);

/* ---- BGM：C→G→Am→F、8分音符×32ステップのループ ---- */
const BGM_MEL = [76,0,79,0, 81,0,79,0, 74,0,79,0, 83,0,79,0, 81,0,84,0, 83,0,81,0, 81,0,79,0, 76,0,72,0];
const BGM_BASS = [48, 43, 45, 41];
const bgm = { on:false, step:0, nextT:0, timer:null };
function pluck(m, t, vol){
  const ac = AC;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = "triangle"; o.frequency.value = mtof(m);
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(vol, t + 0.006);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.30);
  o.connect(g).connect(soundBus(ac)); o.start(t); o.stop(t + 0.32);
  const o2 = ac.createOscillator(), g2 = ac.createGain();
  o2.type = "sine"; o2.frequency.value = mtof(m) * 2;
  g2.gain.setValueAtTime(vol * 0.22, t);
  g2.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
  o2.connect(g2).connect(soundBus(ac)); o2.start(t); o2.stop(t + 0.14);
}
function bassNote(m, t, vol, dur){
  const ac = AC;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = "sine"; o.frequency.value = mtof(m);
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(vol, t + 0.01);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g).connect(soundBus(ac)); o.start(t); o.stop(t + dur + 0.02);
}
function hatNoise(t, vol){
  const ac = AC;
  const src = noiseSrc(ac, false);
  const hp = ac.createBiquadFilter(); hp.type = "highpass"; hp.frequency.value = 6500;
  const g = ac.createGain();
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.045);
  src.connect(hp).connect(g).connect(soundBus(ac)); src.start(t); src.stop(t + 0.06);
}
function kickPop(t){
  const ac = AC;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = "sine";
  o.frequency.setValueAtTime(130, t);
  o.frequency.exponentialRampToValueAtTime(52, t + 0.09);
  g.gain.setValueAtTime(0.16, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.11);
  o.connect(g).connect(soundBus(ac)); o.start(t); o.stop(t + 0.12);
}
function scheduleStep(s, t){
  const m = BGM_MEL[s];
  if (m) pluck(m, t, 0.16);
  if (s % 8 === 0){ bassNote(BGM_BASS[s / 8], t, 0.20, 0.34); kickPop(t); }
  if (s % 8 === 4) bassNote(BGM_BASS[(s - 4) / 8] + 7, t, 0.10, 0.2);
  if (s % 4 === 2) hatNoise(t, 0.045);
}
function bgmTick(){
  if (!bgm.on || !AC) return;
  const SPB = 60 / 138 / 2;   // テンポ138、8分音符
  if (bgm.nextT < AC.currentTime - 0.1) bgm.nextT = AC.currentTime + 0.05;
  while (bgm.nextT < AC.currentTime + 0.28){
    scheduleStep(bgm.step, bgm.nextT);
    bgm.nextT += SPB;
    bgm.step = (bgm.step + 1) % 32;
  }
}
function bgmStart(){
  if (bgm.on || !AC) return;
  bgm.on = true; bgm.step = 0; bgm.nextT = AC.currentTime + 0.08;
  bgm.timer = setInterval(bgmTick, 90);
}

/* ---- 風の音（サラサラ）：常時の環境音 ---- */
let windN = null;
function windStart(){
  if (windN || !AC) return;
  try {
    const ac = AC;
    const src = noiseSrc(ac, true);
    const bp = ac.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = 480; bp.Q.value = 0.5;
    const g = ac.createGain(); g.gain.value = 0.035;
    const lfo = ac.createOscillator(); lfo.frequency.value = 0.07;
    const lfoG = ac.createGain(); lfoG.gain.value = 170;
    lfo.connect(lfoG).connect(bp.frequency); lfo.start();
    const lfo2 = ac.createOscillator(); lfo2.frequency.value = 0.19;
    const lfo2G = ac.createGain(); lfo2G.gain.value = 0.013;
    lfo2.connect(lfo2G).connect(g.gain); lfo2.start();
    src.connect(bp).connect(g).connect(soundBus(ac)); src.start();
    windN = { src };
  } catch(e) {}
}
let ambStarted = false;
function startAmbience(){
  if (ambStarted || !AC) return;
  ambStarted = true;
  bgmStart(); windStart();
}

/* ---- スイングの風切り（シュパーン） ---- */
function whooshSound(){
  if (!settings.sound) return;
  try {
    const ac = audio(), t = ac.currentTime;
    const src = noiseSrc(ac, false);
    const bp = ac.createBiquadFilter(); bp.type = "bandpass"; bp.Q.value = 1.4;
    bp.frequency.setValueAtTime(500, t);
    bp.frequency.exponentialRampToValueAtTime(2600, t + 0.10);
    bp.frequency.exponentialRampToValueAtTime(650, t + 0.30);
    const g = ac.createGain();
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(0.22, t + 0.09);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.32);
    src.connect(bp).connect(g).connect(soundBus(ac)); src.start(t); src.stop(t + 0.35);
  } catch(e) {}
}

/* ---- 飛行中の風切り（ボールの速さに追随） ---- */
let flyN = null;
function flyWindStart(){
  flyWindStop();
  if (!AC) return;
  try {
    const ac = AC;
    const src = noiseSrc(ac, true);
    const bp = ac.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = 900; bp.Q.value = 0.8;
    const g = ac.createGain(); g.gain.value = 0;
    src.connect(bp).connect(g).connect(soundBus(ac)); src.start();
    flyN = { src, bp, g };
  } catch(e) {}
}
function flyWindUpdate(speed){
  if (!flyN || !AC) return;
  const t = AC.currentTime;
  flyN.g.gain.setTargetAtTime(Math.min(0.20, speed * 0.004), t, 0.08);
  flyN.bp.frequency.setTargetAtTime(500 + speed * 22, t, 0.08);
}
function flyWindStop(){
  if (!flyN) return;
  const n = flyN; flyN = null;
  try { n.g.gain.setTargetAtTime(0, AC.currentTime, 0.05); setTimeout(() => { try { n.src.stop(); } catch(e){} }, 350); } catch(e) {}
}

/* ---- 地面別の着地音 ---- */
function landSound(surf, s){
  if (!settings.sound) return;
  try {
    const ac = audio(), t = ac.currentTime;
    const burst = (type, f, q, dur, vol, when) => {
      const w = when || 0;
      const src = noiseSrc(ac, false);
      const fl = ac.createBiquadFilter(); fl.type = type; fl.frequency.value = f; if (q) fl.Q.value = q;
      const g = ac.createGain();
      g.gain.setValueAtTime(vol, t + w);
      g.gain.exponentialRampToValueAtTime(0.001, t + w + dur);
      src.connect(fl).connect(g).connect(soundBus(ac)); src.start(t + w); src.stop(t + w + dur + 0.05);
    };
    const thump = (f, dur, vol) => {
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = "sine"; o.frequency.setValueAtTime(f, t);
      o.frequency.exponentialRampToValueAtTime(Math.max(40, f * 0.55), t + dur);
      g.gain.setValueAtTime(vol, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      o.connect(g).connect(soundBus(ac)); o.start(t); o.stop(t + dur + 0.02);
    };
    if (surf === "green"){ burst("lowpass", 850, 0, 0.09, 0.30 * s); thump(150, 0.10, 0.16 * s); }              // トスッ
    else if (surf === "rough"){ burst("lowpass", 480, 0, 0.16, 0.42 * s); burst("bandpass", 2400, 0.7, 0.22, 0.07 * s, 0.03); }  // ボフッ＋草ずれ
    else if (surf === "sand"){ burst("lowpass", 700, 0, 0.07, 0.50 * s); burst("lowpass", 500, 0, 0.16, 0.28 * s, 0.05); }       // ザシュッ
    else { burst("bandpass", 1800, 1.0, 0.07, 0.50 * s); thump(190, 0.08, 0.20 * s); }                            // フェアウェイ：カツッ
  } catch(e) {}
}

/* ---- 地面別の転がり音（転がっている間だけ鳴るループ） ---- */
const ROLL_SND = {
  fairway: { type:"bandpass", f:1500, q:0.7, base:0.055 },
  green:   { type:"lowpass",  f:750,  q:0.5, base:0.040 },
  rough:   { type:"bandpass", f:2300, q:0.6, base:0.060 },
  sand:    { type:"lowpass",  f:500,  q:0.5, base:0.012 }
};
let rollN = null;
function rollSoundStart(surf, scale){
  rollSoundStop();
  if (!AC) return;
  const prm = ROLL_SND[surf] || ROLL_SND.fairway;
  try {
    const ac = AC;
    const src = noiseSrc(ac, true);
    const fl = ac.createBiquadFilter(); fl.type = prm.type; fl.frequency.value = prm.f; fl.Q.value = prm.q;
    const g = ac.createGain(); g.gain.value = 0;
    src.connect(fl).connect(g).connect(soundBus(ac)); src.start();
    rollN = { src, g, base: prm.base * (scale || 1) };
  } catch(e) {}
}
function rollSoundUpdate(v){
  if (!rollN || !AC) return;
  rollN.g.gain.setTargetAtTime(rollN.base * Math.min(1, v / 18), AC.currentTime, 0.06);
}
function rollSoundStop(){
  if (!rollN) return;
  const n = rollN; rollN = null;
  try { n.g.gain.setTargetAtTime(0, AC.currentTime, 0.04); setTimeout(() => { try { n.src.stop(); } catch(e){} }, 300); } catch(e) {}
}

/* ============ ショット ============ */
const shotBtn = document.getElementById("shotBtn");
let snapCam = true;
const lookCur = new THREE.Vector3(0, 0, -10);
function pressStart(){
  if (state !== "aim") return;
  audio();
  state = "hold";
  lockedAim = aimOffset;
  holdStart = performance.now();
  needle.style.display = "block";
  shotBtn.classList.add("hold");
  if (arrow) arrow.visible = true;
  // 押した瞬間：アドレス絵（右向き・ボールに正対した構え）。狙いの段階からアドレス絵なので、絵はそのまま。
  setCharaTex(texAddress);   // 読めていなければ立ち絵のまま
  holdStage = 0;
  seqScale = (CLUBS[clubIdx].name === "PT") ? 0.6 : 1;   // パターはスイングシーケンス全体を時間×0.6で短縮
}
function releaseShot(){
  // 離した瞬間にゲージ結果は確定。ここからは "swing" 状態で
  // ダウンスイング（0.07秒）→インパクト（その瞬間に fire）→フォロースルー→フィニッシュと進む。
  if (state !== "hold") return;
  needle.style.display = "none";
  shotBtn.classList.remove("hold");
  if (CLUBS[clubIdx].name !== "PT") whooshSound();   // スイングの風切り（シュパーン）
  if (CLUBS[clubIdx].name === "PT"){
    // パットはテークバック〜フォロースルーなし（2026-11-22 ユーザー指示）：アドレスとインパクトの2枚だけ。
    // 離した瞬間にインパクト絵で即発射し、そのまま保持する（swingStage=3 で後段のポーズ進行を止める）。
    swingP = needlePos;
    swingStage = 3;
    setCharaTex(texImpact);
    fire(swingP);
    return;
  }
  state = "swing";
  swingT = 0;
  swingP = needlePos;
  swingStage = 0;
  setCharaTex(texDown);   // ダウンスイング絵
}
document.addEventListener("pointerdown", () => { audio(); });   // 最初のタップで BGM・風の音を開始（自動再生制限対策）
shotBtn.addEventListener("pointerdown", e => { e.preventDefault(); pressStart(); });
shotBtn.addEventListener("pointerup", e => { e.preventDefault(); releaseShot(); });
shotBtn.addEventListener("pointercancel", () => releaseShot());

function fire(p){
  const c = CLUBS[clubIdx];
  needle.style.display = "none";
  shotBtn.classList.remove("hold");
  const half = c.best / 200;                    // ベスト帯の半幅（比率）
  const dev = p - 0.5;
  let best = true, dN = 0, sign = 0;
  if (Math.abs(dev) > half){
    best = false;
    sign = Math.sign(dev);
    dN = Math.min(1, (Math.abs(dev) - half) / (0.5 - half));
  }
  const curve = sign * dN * 12 * Math.PI / 180; // 最大12°
  const mult = 1 - 0.25 * dN;                   // 最大−25%
  strokes++; strokesEl.textContent = strokes;
  prevBallPos.copy(ball.position);
  const dir = aimVector(lockedAim + curve);
  const isPutt = c.name === "PT";
  hitSound(best, isPutt);
  showMsg(best ? "ベストショット！" : (dN > 0.66 ? "大きく外れた…" : "少し外れた"), 1800);
  marker.visible = false;
  if (arrow) arrow.visible = false;
  // キャラ絵はスイングシーケンス側（animate）で管理する。ここでは発射時点のポーズ＝インパクトのまま。
  // camDelay：発射後この秒数まではスイング視点を保持し、キャラも表示したままにする（フィニッシュの余韻）。
  const sS = isPutt ? 0.6 : 1;
  shot = { dir, t:0, putt:isPutt, vel:null, rollV:0, rollDist:0, origin:ball.position.clone(), seqS:sS, camDelay:0.83 * sS };
  if (isPutt){
    const D = Math.min(distToCup(), 60) * mult;
    shot.rollDist = D;
    shot.rollV = Math.sqrt(2 * PUTT_A * Math.max(D, 0.01));
    state = "roll";
    rollSoundStart(surfaceAt(ball.position.x, ball.position.z), 0.5);   // パットの転がり音（小さめ）
  } else {
    const D = c.dist * mult;
    const carry = D * c.carry;
    shot.carryDist = carry;
    shot.rollDist = D - carry;
    const th = c.angle * Math.PI / 180;
    const v = Math.sqrt(carry * GRAV / Math.sin(2 * th));
    shot.vel = new THREE.Vector3(dir.x * v * Math.cos(th), v * Math.sin(th), dir.z * v * Math.cos(th));
    state = "fly";
    flyWindStart();   // 飛行中の風切り
    // カメラ演出パターンの抽選（2026-11-22 ユーザー指示：劇的なパターンを複数用意しランダムに切り替える）
    const POOL = ["quarter", "quarter", "low", "top", "cup", "chase", "slow"];
    let pat = settings.cam === "random" ? POOL[Math.floor(Math.random() * POOL.length)] : settings.cam;
    if ((pat === "cup" || pat === "chase") && carry + shot.rollDist < 60) pat = "quarter";   // 短いショットでは読み替え
    shot.pattern = pat;
    shot.apexY = 0;
    const sx = dir.z, sz = -dir.x;   // 進行方向の横（クォーターと同じ側）
    if (pat === "low"){          // ローアングル：弾道の中ほど・地上すれすれから見上げる
      shot.patPos = new THREE.Vector3(shot.origin.x + dir.x * carry * 0.45 + sx * 8, 1.15,
                                      shot.origin.z + dir.z * carry * 0.45 + sz * 8);
    } else if (pat === "cup"){   // カップ側リバース：着地点の先から飛んでくるボールを迎える
      const lx = shot.origin.x + dir.x * (carry + shot.rollDist * 0.5), lz = shot.origin.z + dir.z * (carry + shot.rollDist * 0.5);
      shot.patPos = new THREE.Vector3(lx + dir.x * 11 + sx * 3.5, 2.3, lz + dir.z * 11 + sz * 3.5);
    }
  }
}
function startRoll(){
  ball.position.y = BALL_R;
  if (inLake(ball.position.x, ball.position.z)) return water();
  // 着地点の地面で跳ね・転がりが変わる（2026-11-22 ユーザー指示）
  shot.surf = surfaceAt(ball.position.x, ball.position.z);
  const sf = SURF[shot.surf] || SURF.fairway;
  shot.rollDist *= sf.roll;
  shot.hopH = Math.min(1.6, Math.abs(shot.impactVy || 0) * 0.055) * sf.bounce;
  shot.rollT = 0;
  shot.hopIdx = 0;
  flyWindStop();
  landSound(shot.surf, Math.min(1, Math.abs(shot.impactVy || 0) / 16 + 0.25));   // 地面別の着地音（落下が大きいほど強い）
  rollSoundStart(shot.surf, 1);
  if (shot.rollDist <= 0.05) return finishShot();
  shot.rollV = Math.sqrt(2 * ROLL_A * shot.rollDist);
  state = "roll";
}
function finishShot(){
  rollSoundStop(); flyWindStop();
  ball.position.y = BALL_R;
  if (distToCup() < 0.2) return holed();   // カップイン判定（見た目0.11より少し甘め）
  state = "aim";
  aimOffset = 0; knob.style.transform = "translate(0px,0)";
  placeChar(); marker.visible = true;
  suggestClub(); updateArrow(); snapCam = true;
}
function water(){
  flyWindStop(); rollSoundStop();
  splashSound();
  strokes++; strokesEl.textContent = strokes;
  showMsg("池ポチャ… 1罰で前の位置から打ち直し", 2400);
  ball.position.copy(prevBallPos); ball.position.y = BALL_R;
  state = "aim";
  aimOffset = 0; knob.style.transform = "translate(0px,0)";
  placeChar(); marker.visible = true;
  suggestClub(); updateArrow(); snapCam = true;
}
function holed(){
  state = "done";
  marker.visible = false;
  ball.position.set(CUP.x, 0.04, CUP.z);
  rollSoundStop();
  cupSound();
  const d = strokes - PAR;
  const label = d <= -2 ? "イーグル！" : d === -1 ? "バーディー！" : d === 0 ? "パー" : d === 1 ? "ボギー" : "+" + d;
  document.getElementById("resultTitle").textContent = "カップイン！ " + label;
  document.getElementById("resultDetail").textContent = "HOLE 1（Par " + PAR + "）を " + strokes + " 打でクリア";
  document.getElementById("result").style.display = "flex";
}
document.getElementById("againBtn").addEventListener("click", () => {
  document.getElementById("result").style.display = "none";
  ball.position.set(0, BALL_R, 0);
  strokes = 0; strokesEl.textContent = 0;
  state = "aim"; aimOffset = 0; knob.style.transform = "translate(0px,0)";
  selectClub(0); placeChar(); marker.visible = true; updateArrow(); snapCam = true;
  showMsg("", 0);
});
function placeChar(){
  // 打つ前は正面（カメラ側）ではなく、打つ方向を向いたアドレス絵で構える（2026-11-22 ユーザー指示）
  setCharaTex(texAddress || texStand);
  const dx = CUP.x - ball.position.x, dz = CUP.z - ball.position.z;
  const L = Math.hypot(dx, dz) || 1, ux = dx / L, uz = dz / L;
  const lx = uz, lz = -ux;   // 進行方向の左
  chara.visible = true; charShadow.visible = true;
  chara.position.set(ball.position.x + lx * 0.62, 0.70, ball.position.z + lz * 0.62);
  // アドレス絵のクラブがボールに届いて見えるよう、ボール側へ少し寄せる（従来は pressStart で実施）
  const toBall = new THREE.Vector3(ball.position.x - chara.position.x, 0, ball.position.z - chara.position.z);
  if (toBall.lengthSq() > 0.0001){
    toBall.normalize();
    chara.position.addScaledVector(toBall, 0.25);
  }
  charShadow.position.set(chara.position.x, 0.03, chara.position.z);
}
function suggestClub(){
  if (onGreen()) return selectClub(13);
  const need = distToCup();
  // バッグ内のクラブから「足りる中で最小」を選ぶ。足りるものがなければ最長
  const bag = settings.bag.filter(i => i !== 13);
  let pick = bag[0];
  for (const i of bag) if (CLUBS[i].dist >= need) pick = i;
  selectClub(pick);
}

/* ============ メインループ ============ */
const clock = new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const now = performance.now();
  // ゲージ針
  if (state === "hold"){
    const el = (now - holdStart) / 1000 / CLUBS[clubIdx].gauge;
    const ph = el % 2;
    needlePos = ph < 1 ? ph : 2 - ph;
    needle.style.left = (needlePos * 100) + "%";
    // 押している間：アドレス（押した瞬間）→ +0.18秒 テークバック → +0.42秒 トップで保持。パットはアドレスのまま（ポーズ進行なし）
    const held = (now - holdStart) / 1000;
    if (CLUBS[clubIdx].name !== "PT"){
      if (holdStage === 0 && held >= 0.18 * seqScale){ setCharaTex(texTakeback); holdStage = 1; }
      else if (holdStage === 1 && held >= 0.42 * seqScale){ setCharaTex(texBack); holdStage = 2; }
    }
  }
  // スイング（離した後〜インパクト）：ダウンスイング絵で 0.07秒 → インパクト絵に切り替えた瞬間に発射
  if (state === "swing"){
    swingT += dt;
    if (swingT >= 0.07 * seqScale){
      setCharaTex(texImpact);   // インパクト絵
      swingStage = 1;
      fire(swingP);             // ここで state が fly / roll へ遷移し、shot.t が 0 から進み始める
    }
  }
  // 物理
  if (state === "fly" && shot){
    // スローモーションパターン：落下局面（頂点の45%以下）で時間を 0.35 倍に
    let dtF = dt;
    if (shot.pattern === "slow" && shot.vel.y < 0 && ball.position.y < shot.apexY * 0.45) dtF = dt * 0.35;
    shot.t += dtF;
    shot.vel.y -= GRAV * dtF;
    ball.position.addScaledVector(shot.vel, dtF);
    if (ball.position.y > shot.apexY) shot.apexY = ball.position.y;
    flyWindUpdate(shot.vel.length());
    if (ball.position.y < BALL_R) ball.position.y = BALL_R;
    const dx = ball.position.x - shot.origin.x, dz = ball.position.z - shot.origin.z;
    const traveled = Math.hypot(dx, dz);
    if (traveled >= shot.carryDist || (ball.position.y <= BALL_R && shot.vel.y < 0)){ shot.impactVy = shot.vel.y; startRoll(); }
  } else if (state === "roll" && shot){
    shot.t += dt;
    shot.rollT = (shot.rollT || 0) + dt;
    const a = shot.putt ? PUTT_A : ROLL_A;
    shot.rollV -= a * dt;
    rollSoundUpdate(Math.max(shot.rollV, 0));
    if (shot.rollV <= 0){ shot.rollV = 0; finishShot(); }
    else {
      ball.position.addScaledVector(shot.dir, shot.rollV * dt);
      // 着地直後の跳ね：地面の硬さ（hopH）に応じて、減衰しながら3回ほど弾む
      if (shot.putt) ball.position.y = BALL_R;
      else if (shot.hopH > 0.02 && shot.rollT < 0.9){
        const ph = shot.rollT / 0.9;
        ball.position.y = BALL_R + shot.hopH * Math.abs(Math.sin(ph * Math.PI * 3)) * (1 - ph);
        const hi = Math.floor(ph * 3);
        if (hi > (shot.hopIdx || 0)){ shot.hopIdx = hi; landSound(shot.surf, Math.max(0.12, (1 - ph) * 0.55)); }   // 跳ねの着地ごとに小さく
      } else ball.position.y = BALL_R;
      const d = distToCup();
      if (d < 0.2 && shot.rollV < 8) holed();
      else if (!shot.putt && inLake(ball.position.x, ball.position.z)) water();
    }
  }
  // 発射後のポーズ進行：インパクト（0.05秒保持）→ フォロースルー（0.28秒）→ フィニッシュ（余韻、保持）
  if (shot && (state === "fly" || state === "roll")){
    const s = shot.seqS;
    if (swingStage === 1 && shot.t >= 0.05 * s){ setCharaTex(texFollow, FOLLOW_H, FOLLOW_Y); swingStage = 2; }
    else if (swingStage === 2 && shot.t >= 0.33 * s){ setCharaTex(texFinish, FINISH_H, FINISH_Y); swingStage = 3; }
  }
  // キャラと影は、フィニッシュ終了＝カメラ移行の開始時点（発射後 camDelay）で隠す
  if (shot && (state === "fly" || state === "roll") && shot.t >= shot.camDelay && chara.visible){
    chara.visible = false; charShadow.visible = false;
  }
  // ボール影・マーカー
  ballShadow.position.set(ball.position.x, 0.03, ball.position.z);
  marker.position.set(ball.position.x, 0.05, ball.position.z);
  const pulse = 1 + Math.sin(now * 0.006) * 0.18;
  marker.scale.set(pulse, pulse, 1);
  // カメラ
  let camPos, camLook;
  const vp = viewPreset();
  if (state === "aim" || state === "hold" || state === "swing"){
    const dir = aimVector(aimOffset);
    camPos = new THREE.Vector3(ball.position.x - dir.x * vp.d, vp.h, ball.position.z - dir.z * vp.d);
    camLook = new THREE.Vector3(ball.position.x + dir.x * 11, 0.5, ball.position.z + dir.z * 11);
    if (snapCam){ camera.position.copy(camPos); snapCam = false; }
    else camera.position.lerp(camPos, 0.22);
    lookCur.lerp(camLook, 0.35);
  } else if ((state === "fly" || state === "roll") && shot){
    const d = shot.dir;
    if (shot.t < shot.camDelay){
      // フィニッシュの余韻が終わるまではスイング視点を保持：発射位置（origin）基準の aim カメラで、キャラと発射点を見る
      camPos = new THREE.Vector3(shot.origin.x - d.x * vp.d, vp.h, shot.origin.z - d.z * vp.d);
      camLook = new THREE.Vector3(shot.origin.x + d.x * 11, 0.5, shot.origin.z + d.z * 11);
      camera.position.lerp(camPos, 0.22);
      lookCur.lerp(camLook, 0.35);
    } else if (shot.putt){
      camPos = new THREE.Vector3(ball.position.x - d.x * 6, 3.0, ball.position.z - d.z * 6);
      camLook = new THREE.Vector3(ball.position.x + d.x * 6, 0.3, ball.position.z + d.z * 6);
      camera.position.lerp(camPos, 0.25); lookCur.lerp(camLook, 0.3);
    } else {
      // 演出パターンごとにカメラを切り替える（スイング視点から 0.6秒かけて滑らかに移行）
      const k = quarterK(shot.t - shot.camDelay);
      const pat = shot.pattern || "quarter";
      if (pat === "quarter" || pat === "slow"){
        // サイドバッククォーター追随：横10m＋後方7m＋高さ5m。移行中は基準点を発射位置→ボールへブレンド
        const ox = (-d.x * vp.d) * (1 - k) + ( d.z * 10 - d.x * 7) * k;
        const oy = (vp.h) * (1 - k) + 5 * k;
        const oz = (-d.z * vp.d) * (1 - k) + (-d.x * 10 - d.z * 7) * k;
        const ax = shot.origin.x + (ball.position.x - shot.origin.x) * k;
        const ay = shot.origin.y + (ball.position.y - shot.origin.y) * k;
        const az = shot.origin.z + (ball.position.z - shot.origin.z) * k;
        camPos = new THREE.Vector3(ax + ox, ay + oy, az + oz);
        camera.position.copy(camPos);   // 位置は anchor + offset で直接決める（lerp の重ね掛けで遅れない）
        camLook = new THREE.Vector3(ball.position.x + d.x * 6, ball.position.y, ball.position.z + d.z * 6);
        lookCur.lerp(camLook, 0.35);
      } else {
        let desired;
        if (pat === "low" || pat === "cup"){
          desired = shot.patPos;   // 固定位置からボールを見送る／迎える
        } else if (pat === "top"){   // 俯瞰：ボールの真上52mから追う
          desired = new THREE.Vector3(ball.position.x + d.z * 6 - d.x * 10, ball.position.y + 52,
                                      ball.position.z - d.x * 6 - d.z * 10);
        } else {   // chase 前方フライバイ：ボールの前方9mを飛び、振り返ってボールを捉え続ける
          desired = new THREE.Vector3(ball.position.x + d.x * 9 + d.z * 2.5, ball.position.y + 2.2,
                                      ball.position.z + d.z * 9 - d.x * 2.5);
        }
        const swPos = new THREE.Vector3(shot.origin.x - d.x * vp.d, vp.h, shot.origin.z - d.z * vp.d);
        if (k < 1) camera.position.lerpVectors(swPos, desired, k);
        else camera.position.copy(desired);
        camLook = ball.position.clone();   // 常にボールを捉える
        lookCur.lerp(camLook, 0.4);
      }
    }
  }
  camera.lookAt(lookCur);
  updateOccluders();   // カメラとキャラの間に入った建物・木・岩をスケルトン表示に
  if (state === "aim" || state === "hold" || state === "swing") remainEl.textContent = Math.round(distToCup());
  renderer.render(scene, camera);
}
placeChar();
animate();

function onResize(){
  // 実際に見えている領域（visualViewport）にキャンバスと UI・ロゴ画面を合わせる。
  // ツールバーの出入りでレイアウト側と見える範囲がずれても、操作系が画面外に落ちないようにする。
  // ブラウザ側で拡大表示が保持されている場合も、visualViewport の幅・オフセットに
  // 追随することで、見えている範囲の中に収まる（2026-11-22 実機でロゴがはみ出す報告への対策）。
  const vv = window.visualViewport;
  const w = vv ? vv.width : window.innerWidth;
  const h = vv ? vv.height : window.innerHeight;
  const ox = vv ? vv.offsetLeft : 0;
  const oy = vv ? vv.offsetTop : 0;
  document.documentElement.style.setProperty("--apph", h + "px");
  document.documentElement.style.setProperty("--appw", w + "px");
  for (const id of ["game", "ui", "splash"]){
    const el = document.getElementById(id);
    if (el){ el.style.left = ox + "px"; el.style.top = oy + "px"; el.style.width = w + "px"; }
  }
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
}
window.addEventListener("resize", onResize);
window.addEventListener("orientationchange", () => setTimeout(onResize, 60));
if (window.visualViewport){
  window.visualViewport.addEventListener("resize", onResize);
  window.visualViewport.addEventListener("scroll", onResize);
}
onResize();

/* デバッグ／検証用API */
/* ============ ロゴ画面 ============ */
document.getElementById("splashVer").textContent = "PROTOTYPE v" + PAGE_VER;
document.getElementById("splash").addEventListener("pointerdown", e => {
  e.preventDefault();
  audio();   // このタップを合図に BGM・風の音を開始する
  document.getElementById("splash").classList.add("hide");
});

window.__golf = {
  state: () => state,
  strokes: () => strokes,
  ballPos: () => ({ x: ball.position.x, y: ball.position.y, z: ball.position.z }),
  dist: () => distToCup(),
  club: () => CLUBS[clubIdx].name,
  pattern: () => shot ? (shot.pattern || null) : null,
  camY: () => camera.position.y,
  occFaded: () => occluders.filter(u => u.goal < 1).length,
  surf: (x, z) => surfaceAt(x, z),
  snd: () => ({ ac: AC ? AC.state : "none", bgm: bgm.on, step: bgm.step, wind: !!windN, fly: !!flyN, roll: !!rollN }),
  shotSurf: () => shot ? (shot.surf || null) : null,
  select: i => { if (state === "aim") selectClub(i); },
  setAim: deg => { aimOffset = deg * Math.PI / 180; updateArrow(); },
  press: () => pressStart(),
  release: () => releaseShot(),
  fireAt: p => { if (state === "aim"){ pressStart(); needlePos = p; releaseShot(); } },
  place: (x, z) => { if (state === "aim"){ ball.position.set(x, BALL_R, z); placeChar(); updateArrow(); snapCam = true; } }
};
</script>
